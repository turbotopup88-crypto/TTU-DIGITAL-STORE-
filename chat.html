<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>الشات الذكي</title>
    <style>
        * {
            direction: rtl;
            text-align: right;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial;
            background: #f5f5f5;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .back-link {
            padding: 15px 20px;
            background: #f9f9f9;
        }
        .back-link a {
            color: #4285F4;
            text-decoration: none;
            font-weight: bold;
        }
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-header h2 {
            margin: 0;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message-bubble {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 15px;
            word-wrap: break-word;
            line-height: 1.5;
        }
        .message.user .message-bubble {
            background: #4285F4;
            color: white;
            border-bottom-right-radius: 0;
        }
        .message.bot .message-bubble {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 0;
        }
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: Arial;
        }
        button {
            padding: 12px 20px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        button:hover {
            background: #357ae8;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .typing {
            display: flex;
            gap: 5px;
            padding: 10px 15px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="back-link">
            <a href="index.html">← العودة</a>
        </div>

        <div class="chat-header">
            <h2>🤖 مساعدك الذكي</h2>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-bubble">
                    مرحباً! 👋 أنا هنا لمساعدتك. اسأل عن أي شيء!
                </div>
            </div>
        </div>

        <div class="chat-input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="اكتب سؤالك..."
                onkeypress="if(event.key==='Enter') sendMessage()"
            >
            <button onclick="sendMessage()" id="sendBtn">إرسال</button>
        </div>
    </div>

    <script>
        // ⬇️ ضع Google Gemini API Key هنا ⬇️
        const API_KEY = "استبدل بـ API Key الخاص بك";
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // عرض رسالة المستخدم
            addMessage(message, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;

            // عرض مؤشر الكتابة
            showTyping();

            try {
                // أرسل الرسالة إلى Gemini
                const response = await fetch(`${API_URL}?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: message
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error('خطأ في الاتصال');
                }

                const data = await response.json();
                const botReply = data.contents[0].parts[0].text;

                // أزل مؤشر الكتابة
                removeTyping();

                // عرض رد البوت
                addMessage(botReply, 'bot');

            } catch (error) {
                removeTyping();
                addMessage('❌ عذراً، حدث خطأ. حاول لاحقاً.', 'bot');
            }

            sendBtn.disabled = false;
            messageInput.focus();
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.innerHTML = `<div class="message-bubble">${text}</div>`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.id = 'typing';
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    <div class="typing">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typing');
            if (typing) typing.remove();
        }
    </script>
</body>
</html>
