<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTU STORE</title>
<link rel="icon" href="https://i.ibb.co/CKWK5brd/48929.png">
<script src="{{ url_for('static', filename='lang.js') }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% include 'partials/header.html' %}
{% include 'partials/search_bar.html' %}

  <div class="hero-slider" id="hero-slider">
    <div class="hero-track" id="hero-track"></div>
    <button class="hero-arrow prev" id="hero-prev" aria-label="البانر السابق">›</button>
    <button class="hero-arrow next" id="hero-next" aria-label="البانر التالي">‹</button>
    <div class="hero-dots" id="hero-dots"></div>
  </div>

  <h2 class="section-title" data-i18n="categoriesTitle">تصفح حسب الفئة</h2>
  <div class="category-strip" id="category-strip"></div>

  <h2 class="section-title" data-i18n="productsTitle">كل المنتجات</h2>
  <div class="product-grid" id="product-grid"></div>
  <div id="grid-sentinel" class="grid-sentinel"></div>

{% include 'partials/footer.html' %}
{% include 'partials/cart_drawer.html' %}

  <script>
    const CATEGORIES = {{ categories_json|safe }};
    const BANNERS = {{ banners_json|safe }};
    const PRODUCTS = {{ products_json|safe }};
    const IS_LOGGED_IN = {{ 'true' if current_user.is_authenticated else 'false' }};
  </script>
  <script src="{{ url_for('static', filename='cart.js') }}"></script>
  <script src="{{ url_for('static', filename='catalog.js') }}"></script>
  <script>
    const track = document.getElementById('hero-track');
    const dotsWrap = document.getElementById('hero-dots');
    let current = 0;
    let autoplayTimer = null;

    BANNERS.forEach((banner, i) => {
      const slide = banner.link ? document.createElement('a') : document.createElement('div');
      slide.className = 'hero-slide';
      if (banner.link) slide.href = banner.link;
      slide.innerHTML = `<img src="${banner.image}" alt="بانر ${i + 1}" loading="${i === 0 ? 'eager' : 'lazy'}">`;
      track.appendChild(slide);

      const dot = document.createElement('button');
      dot.setAttribute('aria-label', `الانتقال للبانر ${i + 1}`);
      if (i === 0) dot.classList.add('active');
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });

    function updateSlider() {
      track.style.transform = `translateX(-${current * 100}%)`;
      [...dotsWrap.children].forEach((d, i) => d.classList.toggle('active', i === current));
    }
    function goTo(index) {
      current = (index + BANNERS.length) % BANNERS.length;
      updateSlider();
      restartAutoplay();
    }
    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }
    document.getElementById('hero-next').addEventListener('click', next);
    document.getElementById('hero-prev').addEventListener('click', prev);
    function restartAutoplay() {
      clearInterval(autoplayTimer);
      autoplayTimer = setInterval(next, 4000);
    }
    restartAutoplay();
    const slider = document.getElementById('hero-slider');
    slider.addEventListener('mouseenter', () => clearInterval(autoplayTimer));
    slider.addEventListener('mouseleave', restartAutoplay);

    const categoryStrip = document.getElementById('category-strip');
    CATEGORIES.forEach((cat) => {
      const item = document.createElement('a');
      item.className = 'category-item';
      item.href = cat.link || '#';
      item.innerHTML = `
        <span class="category-circle"><img src="${cat.image}" alt="${localized(cat.label, cat.labelEn)}" loading="lazy"></span>
        <span>${localized(cat.label, cat.labelEn)}</span>
      `;
      categoryStrip.appendChild(item);
    });

    const grid = document.getElementById('product-grid');
    const allEntries = shuffleArray(Object.entries(PRODUCTS));

    const productGrid = createInfiniteGrid({
      gridEl: grid,
      sentinelEl: document.getElementById('grid-sentinel'),
      items: allEntries,
      pageSize: 22,
      emptyMessage: t('noResults')
    });

    function renderProducts(filter = "") {
      const term = filter.trim().toLowerCase();
      const filtered = !term
        ? allEntries
        : allEntries.filter(([, p]) => p.name.toLowerCase().includes(term) || p.platformTag.toLowerCase().includes(term));
      productGrid.reset(filtered);
    }
    renderProducts();

    const searchBtn = document.getElementById('search-btn');
    const searchBar = document.getElementById('search-bar');
    const searchInput = document.getElementById('search-input');
    const suggestBox = document.getElementById('search-suggestions');
    const MAX_SUGGESTIONS = 5;
    let activeSuggestion = -1;

    function openSearchBar() { searchBar.classList.add('open'); searchInput.focus(); }
    function closeSearchBar() { searchBar.classList.remove('open'); searchInput.value = ""; renderProducts(); closeSuggestions(); }

    searchBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (searchBar.classList.contains('open')) closeSearchBar(); else openSearchBar();
    });

    function highlight(text, term) {
      if (!term) return text;
      const i = text.toLowerCase().indexOf(term.toLowerCase());
      if (i === -1) return text;
      return `${text.slice(0, i)}<mark>${text.slice(i, i + term.length)}</mark>${text.slice(i + term.length)}`;
    }
    function matchingProducts(term) {
      const q = term.trim().toLowerCase();
      if (!q) return [];
      return Object.entries(PRODUCTS).filter(([, p]) => p.name.toLowerCase().includes(q) || p.platformTag.toLowerCase().includes(q));
    }
    function renderSuggestions(term) {
      const matches = matchingProducts(term);
      activeSuggestion = -1;
      if (!term.trim()) { closeSuggestions(); return; }
      if (matches.length === 0) {
        suggestBox.innerHTML = `<p class="suggestion-empty">${t('noResultsFor')(term)}</p>`;
        suggestBox.style.display = 'block';
        searchInput.setAttribute('aria-expanded', 'true');
        return;
      }
      const shown = matches.slice(0, MAX_SUGGESTIONS);
      suggestBox.innerHTML = shown.map(([id, p]) => `
          <a class="suggestion-item" href="/product.html?id=${id}" data-id="${id}">
            <img src="${p.image}" alt="">
            <div class="suggestion-info">
              <span class="s-name">${highlight(localized(p.name, p.nameEn), term)}</span>
              <span class="s-price">${p.price} ${currencyText(p)}</span>
            </div>
          </a>`).join('');
      if (matches.length > MAX_SUGGESTIONS) {
        const more = document.createElement('button');
        more.type = 'button';
        more.className = 'suggestion-more';
        more.textContent = t('showAllResults')(matches.length);
        more.addEventListener('click', () => {
          renderProducts(term);
          closeSuggestions();
          document.getElementById('product-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        suggestBox.appendChild(more);
      }
      suggestBox.style.display = 'block';
      searchInput.setAttribute('aria-expanded', 'true');
    }
    function closeSuggestions() {
      suggestBox.style.display = 'none';
      suggestBox.innerHTML = '';
      searchInput.setAttribute('aria-expanded', 'false');
      activeSuggestion = -1;
    }
    searchInput.addEventListener('input', () => { renderProducts(searchInput.value); renderSuggestions(searchInput.value); });
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeSearchBar(); return; }
      const items = [...suggestBox.querySelectorAll('.suggestion-item')];
      if (items.length === 0) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); activeSuggestion = (activeSuggestion + 1) % items.length; }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeSuggestion = (activeSuggestion - 1 + items.length) % items.length; }
      else if (e.key === 'Enter' && activeSuggestion > -1) { e.preventDefault(); window.location.href = items[activeSuggestion].href; return; }
      else return;
      items.forEach((el, i) => el.classList.toggle('active', i === activeSuggestion));
      items[activeSuggestion].scrollIntoView({ block: 'nearest' });
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) closeSuggestions();
      if (!e.target.closest('.search-bar') && !e.target.closest('#search-btn') && searchBar.classList.contains('open')) closeSearchBar();
    });
  </script>
</body>
</html>
