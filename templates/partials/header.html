  <header class="site-header">
    <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGQQDv_plCTNduaQnsV1TlgFWIGIm0i4mo1QjyhseiFQ&s" alt="شعار المتجر">
    <div class="header-icons">
      {% if show_search|default(true) %}
      <button class="icon-btn" id="search-btn" aria-label="بحث">🔍</button>
      {% endif %}
      <button class="icon-btn" id="lang-toggle" aria-label="تغيير اللغة">
        🌐
        <span class="lang-badge" id="lang-badge">EN</span>
      </button>
      <button class="icon-btn" id="cart-btn" aria-label="السلة">
        🛒
        <span class="cart-badge" id="cart-count" style="display:none">0</span>
      </button>
      {% if current_user.is_authenticated %}
        {% if current_user.is_admin %}
          <a class="icon-btn" href="{{ url_for('admin_dashboard') }}" aria-label="لوحة التحكم" style="font-size:15px;">⚙️</a>
        {% endif %}
        <a class="icon-btn" href="{{ url_for('account') }}" aria-label="حسابي" style="font-size:15px;">👤</a>
      {% else %}
        <a class="icon-btn" href="{{ url_for('login') }}" aria-label="تسجيل الدخول" style="font-size:15px;">🔑</a>
      {% endif %}
    </div>
  </header>
